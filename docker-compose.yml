name: nexora-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.compose.local}
    ports:
      - "127.0.0.1:${NEXORA_DB_HOST_PORT:-5432}:5432"
    volumes:
      - nexora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nexora
      DB_USER: nexora_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.compose.local}
      DB_SSL_MODE: disable
      APP_ENV: development
      SESSION_COOKIE_NAME: nexora_session
      SESSION_COOKIE_SECURE: "false"
      SESSION_TTL_HOURS: "24"
      TRUST_PROXY_HEADERS: "false"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NEXORA_HTTP_HOST_PORT:-8081}:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  nexora-postgres-data:
    name: nexora-local_nexora-postgres-data
